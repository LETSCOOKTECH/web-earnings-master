name: V29 Studio actual Astro and browser validation
on:
  push:
    branches:
      - 'feature/v29-studio-additive'
  pull_request:
    paths:
      - 'examples/astro-dominant-studio-v29/**'
      - 'scripts/audit-v29-production-gates.mjs'
      - 'tests/v29-studio-and-gates.test.mjs'
      - '.github/workflows/studio-v29.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/astro-dominant-studio-v29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: examples/astro-dominant-studio-v29/package-lock.json
      - name: Install pinned Astro dependencies
        run: npm ci --no-audit --no-fund
      - name: Run source-level Astro type check
        run: npm run check
      - name: Build real static HTML routes
        run: npm run build
      - name: Run 20-route pure transformation tests
        run: npm test
      - name: Validate concrete build output
        run: |
          test -f dist/index.html
          test -f dist/tools/csv-to-jsonl/index.html
          test -f dist/tools/jsonl-validator/index.html
          test -f dist/hubs/csv/index.html
          test -f dist/assets/studio-worker.mjs
          grep -q 'noindex,follow' dist/tools/csv-to-jsonl/index.html
          grep -q 'Disallow: /' dist/robots.txt
      - name: Run bounded release artifact audit
        run: node ../../scripts/audit-v29-production-gates.mjs --dist dist --origin https://studio.example.org
      - name: Install real browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run real browser functional tests
        run: npm run test:browser
      - name: Archive browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-v29
          path: examples/astro-dominant-studio-v29/artifacts/
          if-no-files-found: warn
