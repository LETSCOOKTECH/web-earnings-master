name: Sense V27 Public Open Source Agent Access
on:
  pull_request:
    paths:
      - 'LICENSE'
      - 'NOTICE'
      - 'AGENTS.md'
      - 'SKILLS.md'
      - 'README.md'
      - 'docs/AGENT_ACCESS.md'
      - 'scripts/check-public-agent-access-v27.mjs'
      - 'tests/public-agent-discovery-v27.test.mjs'
      - '.github/workflows/public-agent-access-v27.yml'
      - '.agents/skills/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Apache rights, README state and all 50 direct skill links
        run: npm run audit:public-agent:v27
      - name: Validate public agent-access regression tests
        run: npm run test:public-agent:v27
      - name: Verify unauthenticated public GitHub API, raw AGENTS and representative skills
        env:
          REPO_REF: ${{ github.head_ref || github.ref_name }}
        run: npm run audit:public-agent:v27 -- --live --ref "$REPO_REF"
